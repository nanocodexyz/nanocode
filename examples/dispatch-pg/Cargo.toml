version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license = "Apache-2.0"
repository.workspace = true
description = "Dispatcher::pass on a real Postgres board: log commits and SQL transactions per agent start"

[[bin]]
name = "dispatch-pg"
path = "src/main.rs"
