nanocode-dispatcher.workspace = true
nanocode-durability-core.workspace = true
nanocode-executor.workspace = true
nanocode-partitions.workspace = true
nanocode-store-sql = { path = "../../crates/integrations/store-sql" }
nanocode-sync.workspace = true
nanocode-turnlog.workspace = true

[lints]
workspace = true
