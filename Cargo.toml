[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256

[profile.dist]
inherits = "release"
# Size first: most code runs once per turn or never, and smaller text loads and pages in faster.
# The crates on the per-step and per-iteration path (Code Mode and its engine, the shell, HTTP and
# TLS, process) stay at opt-level 3 below. nanocode-cli stays at "s": as the binary crate, its
# opt-level drives the fat-LTO pipeline, and "z" or 3 there changes inlining in the JS interpreter.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

